name: Construire l'APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'Budget-Familial-Personnel-Projet-Android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Extraire le projet Android
        run: |
          unzip -q Budget-Familial-Personnel-Projet-Android.zip -d /tmp/budget-android
          cp -R /tmp/budget-android/app .
          cp /tmp/budget-android/build.gradle .
          cp /tmp/budget-android/settings.gradle .
          cp /tmp/budget-android/gradle.properties .

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accepter les licences Android et installer les composants nécessaires
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Construire l'APK
        run: gradle :app:assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Budget-Familial-Personnel-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
